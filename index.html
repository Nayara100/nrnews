<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NR News | Negócios, marketing e notícias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#050309; --surface:#0f0a19; --text:#ffffff; --muted:#b9aed0; --line:#231a35;
  --lilac:#c4a0f5; --streak:150,90,230; --neg:#c4a0f5; --mkt:#ff78be; --eco:#40c48c; --pol:#6fa8ff;
  --chip-ink:#180c2c; color-scheme:dark;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050309; --surface:#0f0a19; --text:#ffffff; --muted:#b9aed0; --line:#231a35;
    --lilac:#c4a0f5; --streak:150,90,230; --neg:#c4a0f5; --mkt:#ff78be; --eco:#40c48c; --pol:#6fa8ff;
    --chip-ink:#180c2c;
  }
}
:root[data-theme="dark"]{
  --bg:#050309; --surface:#0f0a19; --text:#ffffff; --muted:#b9aed0; --line:#231a35;
  --lilac:#c4a0f5; --streak:150,90,230; --neg:#c4a0f5; --mkt:#ff78be; --eco:#40c48c; --pol:#6fa8ff;
  --chip-ink:#180c2c;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lilac);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* topo */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;height:68px}
.logo{display:flex;align-items:baseline;gap:6px;text-decoration:none;position:relative}
.logo b{font-weight:500;font-size:30px;letter-spacing:-.5px}
.logo span{font-weight:300;font-size:16px}
.logo svg{position:absolute;left:38px;top:-4px;width:14px;height:14px;fill:var(--lilac)}
.date{font-size:14px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--c,var(--text));border-color:var(--c,var(--text));color:var(--chip-ink)}
.chip[data-f="Todas"][aria-pressed="true"]{--c:var(--text);color:var(--bg)}

/* destaque */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.streaks{position:absolute;inset:0;pointer-events:none;-webkit-mask-image:linear-gradient(to top,#000 0%,transparent 55%);mask-image:linear-gradient(to top,#000 0%,transparent 55%)}
.streaks i{position:absolute;bottom:0;filter:blur(14px);background:rgba(var(--streak),.45)}
.hero .wrap{position:relative;padding-top:72px;padding-bottom:96px}
.pill{display:inline-block;border-radius:999px;padding:4px 14px;font-size:13px;font-weight:500;background:var(--c);color:var(--chip-ink)}
.hero h1{font-weight:700;font-size:clamp(2.2rem,6vw,4.6rem);line-height:1.05;letter-spacing:-.02em;margin:22px 0 22px;max-width:16ch}
.hero p{font-weight:300;font-size:clamp(1rem,1.8vw,1.2rem);color:var(--muted);max-width:60ch;margin:0 0 28px}
.meta{font-size:13px;color:var(--muted)}
.rule{display:block;width:72px;height:4px;border-radius:2px;background:var(--c);margin:0 0 22px}

/* lista */
main .wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:56px;padding-top:48px;padding-bottom:80px}
h2{font-size:22px;font-weight:600;margin:0 0 8px}
.feed{list-style:none;margin:0;padding:0}
.item{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:12px 1fr;gap:18px;width:100%;text-align:left;background:none;border:0;padding:26px 0;cursor:pointer}
.dot{width:12px;height:12px;border-radius:50%;background:var(--c);margin-top:9px}
.row .h{display:block;font-size:clamp(1.15rem,2.2vw,1.45rem);font-weight:600;line-height:1.3;margin:0 0 6px}
.row .meta{display:flex;flex-wrap:wrap;gap:4px 14px}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.item.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden;padding-left:30px}
.body p{margin:0 0 12px;max-width:62ch;font-weight:300;font-size:16.5px}
.body .src{font-size:13px;color:var(--muted);margin-bottom:26px}
.empty{padding:40px 0;color:var(--muted)}

/* lateral */
aside{display:flex;flex-direction:column;gap:28px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:26px}
.box p{margin:6px 0 18px;color:var(--muted);font-size:15px}
.btn{display:inline-block;border-radius:999px;padding:12px 22px;font-weight:600;font-size:15px;background:var(--lilac);color:var(--chip-ink);text-decoration:none}
.eds{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;font-size:15px}
.eds li{display:flex;align-items:center;gap:10px}
.eds li span{width:10px;height:10px;border-radius:50%;background:var(--c)}

footer{border-top:1px solid var(--line);padding:28px 0 36px;font-size:13px;color:var(--muted)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}

@media (max-width:860px){
  main .wrap{grid-template-columns:1fr;gap:40px}
  .hero .wrap{padding-top:48px;padding-bottom:72px}
}
@media (prefers-reduced-motion:reduce){.body{transition:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="bar">
      <a class="logo" href="#" aria-label="NR News, início"><b>NR</b><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 0 L11 9 L20 10 L11 11 L10 20 L9 11 L0 10 L9 9 Z"/></svg><span>news</span></a>
      <span class="date" id="today"></span>
    </div>
    <nav class="chips" aria-label="Filtrar por editoria" id="chips"></nav>
  </div>
</header>

<section class="hero" id="hero" aria-label="Destaque">
  <div class="streaks" id="streaks" aria-hidden="true"></div>
  <div class="wrap" id="heroInner"></div>
</section>

<main>
  <div class="wrap">
    <section aria-labelledby="t-feed">
      <h2 id="t-feed">Últimas notícias</h2>
      <ul class="feed" id="feed"></ul>
    </section>
    <aside>
      <div class="box">
        <h2>Tudo que tá bombando, sem textão</h2>
        <p>Negócios, marketing e notícias todo dia no Instagram, em posts rápidos pra ler em 30 segundos.</p>
        <a class="btn" href="https://www.instagram.com/_nrnews/" target="_blank" rel="noopener" id="insta">Seguir @_nrnews no Instagram</a>
      </div>
      <div class="box">
        <h2>Editorias</h2>
        <ul class="eds" id="eds"></ul>
      </div>
    </aside>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 NR News</span>
    <span>Notícias com fonte sempre citada</span>
  </div>
</footer>

<script>
const ED = {"Negócios":"var(--neg)","Marketing":"var(--mkt)","Economia":"var(--eco)","Política":"var(--pol)"};
const NEWS = [
  {ed:"Economia", date:"2026-09-29",
   title:"Desemprego cai para 5,3% e Brasil bate recorde de gente trabalhando",
   lead:"A taxa do trimestre encerrado em agosto ficou 0,3 ponto abaixo da registrada até maio, segundo o IBGE.",
   body:["São 281 mil pessoas a menos procurando emprego em relação ao trimestre anterior. O número de ocupados é o maior desde o início da pesquisa, e hoje 58,9% das pessoas em idade de trabalhar estão empregadas.","A renda média ficou em R$\u00a03.777, estável no trimestre e 3,7% maior que há um ano. A informalidade subiu um pouco, de 37,3% para 37,5% dos trabalhadores."],
   src:"IBGE, via Metrópoles"},
  {ed:"Negócios", date:"2026-09-29",
   title:"AstraZeneca investe US$\u00a02 bilhões em empresa de tratamentos contra o câncer",
   lead:"A farmacêutica vai ficar com cerca de 12% da americana Summit Therapeutics, e as duas vão testar remédios em conjunto.",
   body:["O investimento vem junto com uma parceria para estudos clínicos que combinam tratamentos das duas empresas contra tipos de câncer gastrointestinal. Os testes devem começar em breve.","As ações da AstraZeneca subiram 2% em Londres depois do anúncio."],
   src:"ADVFN"},
  {ed:"Negócios", date:"2026-09-29",
   title:"Airbus faz o primeiro voo do seu novo avião de carga",
   lead:"O A350F começou a fase de testes e deve entrar em operação em 2027.",
   body:["O voo inaugural marca o início da campanha de testes que o modelo precisa cumprir antes de ser liberado para as companhias aéreas."],
   src:"ADVFN"},
  {ed:"Marketing", date:"2026-09-25",
   title:"João Gomes vira embaixador da Copa Energia e música dele vira jingle",
   lead:"A marca estreou no território musical transformando em tema de campanha uma música que o cantor já tinha lançado.",
   body:["A faixa \u201cSom da Energia\u201d saiu primeiro sem nenhuma ligação com a empresa e só depois foi revelada como tema oficial da campanha, criada pela agência Purpple.","A ideia é aproximar a marca do dia a dia dos brasileiros."],
   src:"Meio & Mensagem"},
  {ed:"Negócios", date:"2026-09-26",
   title:"Nubank negocia compra de banco britânico por até R$\u00a069 bilhões",
   lead:"O alvo é o Monzo, um dos maiores bancos digitais do Reino Unido. Seria a porta de entrada do Nubank na Europa.",
   body:["As conversas estão em fase inicial e o negócio pode avaliar o Monzo entre £ 8 bilhões e £ 10 bilhões, algo entre R$ 55 bilhões e R$ 69 bilhões.","O Monzo fechou o ano fiscal de 2026 com mais de 15 milhões de clientes. O Nubank diz que não comenta rumores de mercado."],
   src:"Bloomberg e Sky News"},
  {ed:"Economia", date:"2026-09-28",
   title:"Mercado prevê Selic em 13,50% no fim de 2026",
   lead:"A previsão de inflação para o ano subiu de 4,92% para 4,99%.",
   body:["O Boletim Focus, divulgado toda segunda-feira pelo Banco Central, manteve a expectativa para a taxa básica de juros no fim do ano.","Na prática, o crédito deve continuar caro por mais um tempo."],
   src:"Banco Central (Boletim Focus)"},
  {ed:"Marketing", date:"2026-09-26",
   title:"Propaganda de bets tem até 5 de outubro pra sair do ar",
   lead:"Anúncios, campanhas e marcas em patrocínios esportivos precisam ser retirados.",
   body:["A medida provisória que proíbe as apostas online no Brasil dá às empresas do setor até as 23h59 de 5 de outubro para tirar toda a publicidade do ar.","Os clubes de futebol estão entre os mais afetados: em 2025, os patrocínios de apostas somaram R$ 1,1 bilhão, cerca de um terço das receitas comerciais dos times."],
   src:"Propmark e Portal Anativa"},
  {ed:"Negócios", date:"2026-09-23",
   title:"Rodada de Negócios volta a Santo André após três anos",
   lead:"O encontro entre grandes empresas e fornecedores acontece em 22 de outubro, no Parque Tecnológico.",
   body:["O evento é organizado pelo Ciesp com as regionais do ABC e já tem 35 grandes empresas confirmadas buscando fornecedores. As inscrições vão até 18 de outubro.","Na edição anterior, foram mais de 1.600 reuniões de negócios."],
   src:"Diário do Grande ABC e ABCD Jornal"},
  {ed:"Marketing", date:"2026-09-22",
   title:"Agora dá pra agendar posts direto pelo site do Instagram",
   lead:"Feed e Reels podem ser programados com até 30 dias de antecedência, sem ferramenta externa.",
   body:["O recurso está disponível na versão do Instagram para computador. Os Stories ainda ficam de fora e continuam dependendo do Meta Business Suite para agendamento."],
   src:"Agência Sertão"}
];
const fmt = d => new Date(d+"T12:00:00").toLocaleDateString("pt-BR",{day:"numeric",month:"long"});
document.getElementById("today").textContent = new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});

// faixas de luz do destaque
const st=document.getElementById("streaks");
let seed=7; const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
for(let i=0;i<30;i++){const s=document.createElement("i");s.style.left=(rnd()*100)+"%";s.style.width=(6+rnd()*34)+"px";s.style.height=(35+rnd()*45)+"%";s.style.opacity=(.35+rnd()*.65).toFixed(2);st.appendChild(s)}

let filter="Todas";
const chips=document.getElementById("chips");
["Todas",...Object.keys(ED)].forEach(n=>{
  const b=document.createElement("button");b.className="chip";b.dataset.f=n;b.textContent=n;
  if(ED[n]) b.style.setProperty("--c",ED[n]);
  b.setAttribute("aria-pressed",n===filter);
  b.onclick=()=>{filter=n;chips.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c.dataset.f===n));render()};
  chips.appendChild(b);
});
document.getElementById("eds").innerHTML=Object.entries(ED).map(([n,c])=>`<li style="--c:${c}"><span></span>${n}</li>`).join("");

function render(){
  const list=NEWS.filter(n=>filter==="Todas"||n.ed===filter).sort((a,b)=>b.date.localeCompare(a.date));
  const hero=document.getElementById("heroInner"), feed=document.getElementById("feed");
  if(!list.length){hero.innerHTML="";feed.innerHTML=`<li class="empty">Ainda não tem notícia nessa editoria. Escolha outra ali em cima.</li>`;return}
  const [top,...rest]=list;
  hero.style.setProperty("--c",ED[top.ed]);
  hero.innerHTML=`<span class="pill">${top.ed}</span><h1>${top.title}</h1><span class="rule"></span><p>${top.lead} ${top.body.join(" ")}</p>
    <div class="meta">${fmt(top.date)}, fonte: ${top.src}</div>`;
  feed.innerHTML=(filter==="Todas"?rest:list.slice(1)).map((n,i)=>`
    <li class="item" style="--c:${ED[n.ed]}">
      <button class="row" aria-expanded="false" aria-controls="b${i}">
        <span class="dot" aria-hidden="true"></span>
        <span><span class="h">${n.title}</span><span class="meta"><span>${n.ed}</span><span>${fmt(n.date)}</span></span></span>
      </button>
      <div class="body" id="b${i}"><div><p>${n.lead}</p>${n.body.map(p=>`<p>${p}</p>`).join("")}<div class="src">Fonte: ${n.src}</div></div></div>
    </li>`).join("") || `<li class="empty">Por enquanto, essa é a única notícia dessa editoria.</li>`;
  feed.querySelectorAll(".row").forEach(r=>r.onclick=()=>{const it=r.parentElement;const o=it.classList.toggle("open");r.setAttribute("aria-expanded",o)});
}
render();
</script>
</body>
</html>
